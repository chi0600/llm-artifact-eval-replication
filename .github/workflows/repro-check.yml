name: Replication package checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-evaluation.txt
      - name: Unit tests
        run: python -m unittest discover -s scripts/evaluation -p 'test_*.py'
      - name: Synthetic fixture
        run: python scripts/evaluation/run_mbpp_evalplus.py --config evaluation/configs/mbpp-evalplus-smoke.json
      - name: Check public artifact boundaries
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          with open("workshop/codebook/codebook_41_definitions_public.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 41, len(rows)
          assert all(not ("statement" in k or "speaker" in k) for k in rows[0])
          runs = Path("evaluation/runs")
          for run in sorted(runs.iterdir()):
              result = run / "results.jsonl"
              if not result.exists():
                  continue
              content = result.read_text(encoding="utf-8")
              assert "/Users/" not in content and "/home/" not in content
              lines = content.splitlines()
              assert len(lines) == 50, (run.name, len(lines))
              assert all("evaluation/runs/" in json.loads(line)["raw_output_path"] for line in lines)
          PY
